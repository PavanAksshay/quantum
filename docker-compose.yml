services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum-backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
